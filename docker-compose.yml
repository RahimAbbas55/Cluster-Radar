services:
  postgres:
    image: postgres:16
    container_name: cluster-radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_dev_password
      POSTGRES_DB: cluster_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d cluster_radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: cluster-radar-api
    environment:
      DATABASE_URL: postgresql://radar:radar_dev_password@postgres:5432/cluster_radar
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./worker
    container_name: cluster-radar-worker
    environment:
      DATABASE_URL: postgresql://radar:radar_dev_password@postgres:5432/cluster_radar
      POLL_INTERVAL_SECONDS: 30
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  pgdata: