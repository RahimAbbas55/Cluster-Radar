namespace: cluster-radar

api:
  image: cluster-radar-api
  tag: local
  replicas: 1
  port: 8000
  nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  image: cluster-radar-worker
  tag: local
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

postgres:
  image: postgres
  tag: "16"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
config:
  postgresHost: postgres
  postgresPort: "5432"
  pollIntervalSeconds: "30"

hpa:
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
