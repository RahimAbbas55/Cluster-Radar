# configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-radar-config
  namespace: {{ .Values.namespace }}
data:
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POLL_INTERVAL_SECONDS: {{ .Values.config.pollIntervalSeconds | quote }}